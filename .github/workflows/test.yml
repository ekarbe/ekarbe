name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "requirements*.txt"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q
